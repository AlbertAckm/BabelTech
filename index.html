<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natho Ya Bätsi - El Niño Habla</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    
    header {
      background-color: #2c3e50;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-offline {
      background-color: #27ae60;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h2 { font-size: 1.2rem; margin-bottom: 15px; color: #2c3e50; }

    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: none;
      font-size: 0.95rem;
    }

    button {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    button:hover { background-color: #3498db; }

    .output-box {
      background-color: #f8f9fa;
      border: 1px dashed #bdc3c7;
      padding: 15px;
      border-radius: 6px;
      min-height: 180px;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .audio-controls {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-audio {
      background-color: #e67e22;
    }
    .btn-audio:hover { background-color: #d35400; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Natho Ya Bätsi - El Niño Habla</h1>
      <small>Adaptación Pedagógica al Otomí de Temoaya</small>
    </div>
    <span class="badge-offline">Modo Offline 80/90%</span>
  </header>

  <div class="container">
    <!-- Módulo Docente -->
    <div class="card">
      <h2>Módulo Docente (Español)</h2>
      <textarea id="inputText" placeholder="Escribe o pega aquí la lección en español (ej. 'El autobús transporta a 10 personas')..."></textarea>
      <br>
      <button onclick="adaptarTexto()">Adaptar y Traducir a Otomí</button>
    </div>

    <!-- Módulo Estudiante -->
    <div class="card">
      <h2>Módulo Estudiante (Natho / Otomí)</h2>
      <div id="outputText" class="output-box">
        <i>El contenido adaptado aparecerá aquí...</i>
      </div>
      <div class="audio-controls">
        <button class="btn-audio" onclick="reproducirAudio()">🔊 Escuchar Lección (Audio)</button>
      </div>
    </div>
  </div>

  <script>
    function adaptarTexto() {
      const input = document.getElementById('inputText').value;
      const output = document.getElementById('outputText');

      if (!input.trim()) {
        output.innerHTML = '<i>Por favor ingresa un texto en el módulo docente.</i>';
        return;
      }

      // Prototipo de sustitución pedagógica contextual
      let adaptado = input
        .replace(/autobús/gi, 'camión de San Pedro')
        .replace(/ciudad/gi, 'comunidad');

      output.innerHTML = `<strong>[Traducción al Otomí (Natho)]:</strong><br><br>${adaptado} (Versión adaptada con léxico de Temoaya)`;
    }

    function reproducirAudio() {
      alert("Reproduciendo audio local en Otomí...");
    }
  </script>

</body>
</html>
